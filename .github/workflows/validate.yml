name: Validate game

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Python for sprite generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate pixel-art spritesheets
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/generate_sprites.py
      - name: Check JavaScript syntax
        run: node --check src/game.js
      - name: Check HTML and JavaScript references
        run: node scripts/validate.mjs
